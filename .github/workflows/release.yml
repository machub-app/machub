# Builds MacHub.dmg from a tag and attaches it to that tag's GitHub release (created as a draft if it doesn't exist).
# Run it by hand: Actions › Release app › Run workflow, with the tag (for example v0.2.0).
#
# The app is ad-hoc signed (no Apple developer account), like the releases built locally with scripts/make-dmg.sh:
# users confirm the first launch in System Settings › Privacy & Security. To notarize later, set SIGN_IDENTITY and
# NOTARY_PROFILE for make-dmg.sh (see the script) after importing a Developer ID certificate from secrets.
#
# Not yet run on GitHub: scripts/make-dmg.sh was checked locally on 2026-10-19.
name: Release app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z), matching MARKETING_VERSION and a CHANGELOG.md section
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build MacHub.dmg
        run: scripts/make-dmg.sh build/release

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          dmg="build/release/MacHub-$version.dmg"
          cp "$dmg" build/release/MacHub.dmg   # stable name for the "latest" download link
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes="$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)"
            gh release create "$TAG" --draft --prerelease --title "MacHub $version" --notes "$notes"
          fi
          gh release upload "$TAG" --clobber build/release/MacHub.dmg "$dmg" "$dmg.sha256"
